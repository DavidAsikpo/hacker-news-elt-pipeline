version: 2

models:
  - name: dim_authors
    description: >
      Dimension table with one row per unique author, including a surrogate 
      key derived from the author's username and the date of their first post.
    columns:
      - name: author_id
        description: "Surrogate key generated by hashing the author's username. Matches author_id in fct_posts."
        tests:
          - unique
          - not_null

      - name: author_name
        description: "Author's Hacker News username."
        tests:
          - not_null

      - name: first_post
        description: "Timestamp of the author's earliest post in the dataset."

  - name: fct_posts
    description: >
      Fact table with one row per post, containing measures (points, comments)
      and a foreign key to dim_authors. Domain and bucketed rank fields carried
      forward from int_posts.
    columns:
      - name: post_id
        description: "Unique identifier for the post."
        tests:
          - unique
          - not_null

      - name: author_id
        description: "Surrogate key linking to dim_authors.author_id."
        tests:
          - not_null

      - name: domain
        description: "Domain extracted from the post's URL, or 'url not found' if no URL exists."

      - name: points
        description: "Raw upvote/points count for the post."

      - name: points_rank
        description: "Bucketed range for points (e.g. below 1000, above 1000 points, etc.)."

      - name: num_comments
        description: "Raw comment count for the post."

      - name: comments_rank
        description: "Bucketed range for comment count (e.g. below 500 comments, 500-1000 comments, etc.)."

      - name: created_at
        description: "Timestamp the post was submitted."

      - name: updated_at
        description: "Timestamp the post was updated."