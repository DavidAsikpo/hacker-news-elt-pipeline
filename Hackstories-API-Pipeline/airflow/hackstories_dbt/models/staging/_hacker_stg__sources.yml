version: 2

sources:
  - name: raw_data
    database: dev 
    schema: public 
    tables:
      - name: hack_stories 
        columns:
            - name: id
              tests:
                - not_null
                - unique:
                     config:
                        severity: error
                  
            - name: title
              tests:
                - not_null:
                    config:
                        severity: warn
            - name: url
              tests:
                - not_null:
                    config:
                          severity: warn
            - name: author
              tests:
                - not_null:
                    config:
                        severity: warn
            - name: points
              tests:
                - not_null:
                    config:
                        severity: warn
            - name: num_comments
              tests:
                - not_null:
                    config:
                        severity: warn
            - name: created_at
              tests:
                - not_null:
                    config:
                        severity: warn